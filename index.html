<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lekekroken">
<meta name="theme-color" content="#43B383">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">

<title>Lekekroken</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF5EF; --bg2:#D7EEE2; --card:#FFFFFF; --ink:#24344D; --muted:#6D7E93; --line:#C9DCD3;
  --sun:#FFC93C; --berry:#E4508F; --age2:#43B383; --age3:#6C7CE7; --age5:#C9463D; --agec:#43B383;
  --sky1:#BFE6FF; --sky2:#EAF7FF; --grass:#9ED48A; --wood:#B9824F;
  --shadow:0 5px 0 rgba(36,52,77,.13);
  --r:26px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#172433; --bg2:#1F3143; --card:#26394D; --ink:#EEF4F8; --muted:#A5B6C7; --line:#3A5068;
    --sky1:#14223A; --sky2:#22344F; --grass:#2E5A3B; --wood:#7A5535;
    --shadow:0 5px 0 rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#172433; --bg2:#1F3143; --card:#26394D; --ink:#EEF4F8; --muted:#A5B6C7; --line:#3A5068;
  --sky1:#14223A; --sky2:#22344F; --grass:#2E5A3B; --wood:#7A5535;
  --shadow:0 5px 0 rgba(0,0,0,.35); color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:'Baloo 2','Nunito','Trebuchet MS',system-ui,sans-serif;
  overflow:hidden;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--age3);outline-offset:3px}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1}
#app{position:relative;height:100%;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.active{display:flex}

/* ---------- Gårdstema (5 år) ---------- */
#app.farm .screen:not(#home){background:linear-gradient(180deg,var(--sky1) 0,var(--sky2) calc(100% - 92px),var(--grass) calc(100% - 92px))}
#app.farm .screen:not(#home)::before{content:"";position:absolute;left:0;right:0;bottom:70px;height:56px;pointer-events:none;z-index:0;
  background:linear-gradient(transparent 28%,var(--wood) 28% 40%,transparent 40% 62%,var(--wood) 62% 74%,transparent 74%),
             repeating-linear-gradient(90deg,var(--wood) 0 14px,transparent 14px 54px)}
.bar,.menugrid,.lvgrid,.stage{position:relative;z-index:1}

/* ---------- Forside ---------- */
#home{align-items:center;justify-content:center;gap:clamp(12px,3vh,30px);padding:20px;text-align:center}
#home::before{content:"";position:absolute;inset:auto -10% -30% -10%;height:55%;background:var(--bg2);border-radius:50% 50% 0 0;z-index:0}
#home>*{position:relative;z-index:1}
.logo{margin:0;font-size:clamp(46px,11vw,86px);font-weight:800;line-height:.9;letter-spacing:-1px}
.logo span{display:inline-block;animation:wave 3s ease-in-out infinite}
.trio{display:flex;align-items:flex-end;gap:clamp(4px,2vw,16px)}
.trio .c{display:flex;flex-direction:column;align-items:center;font-weight:700;color:var(--muted);font-size:clamp(14px,3.4vw,19px)}
.trio .c svg{width:clamp(66px,17vw,118px);animation:hop 2.6s ease-in-out infinite}
.trio .c:nth-child(2) svg{width:clamp(80px,20vw,136px);animation-delay:.3s}
.trio .c:nth-child(3) svg{animation-delay:.6s}
.trio .c:nth-child(4) svg{animation-delay:.9s}
.ages{display:flex;gap:clamp(12px,3.5vw,30px);flex-wrap:wrap;justify-content:center}
.agebtn{width:clamp(130px,30vw,210px);aspect-ratio:1;border-radius:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff;box-shadow:0 8px 0 rgba(36,52,77,.2);transition:transform .15s}
.agebtn:active{transform:translateY(4px) scale(.97)}
.agebtn.a2{background:var(--age2)} .agebtn.a3{background:var(--age3)} .agebtn.a5{background:var(--age5)}
.agebtn .num{font-size:clamp(68px,16vw,116px);font-weight:800;line-height:.85}
.agebtn .lbl{font-size:clamp(17px,4.2vw,25px);font-weight:700}
.agebtn .candles{font-size:clamp(18px,4.4vw,28px);letter-spacing:2px}
.agebtn.a5 .candles{letter-spacing:0}
.parent{position:absolute;top:12px;right:12px;z-index:5}
.holdbtn{position:relative;overflow:hidden;padding:9px 16px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:15px;font-weight:600;color:var(--muted)}
.holdbtn::after{content:"";position:absolute;left:0;bottom:0;height:5px;width:0;background:var(--sun)}
.holdbtn.holding::after{width:100%;transition:width var(--hold,1500ms) linear}

/* ---------- Topplinje ---------- */
.bar{display:flex;align-items:center;gap:10px;padding:10px 12px 4px}
.iconbtn{width:58px;height:58px;flex:none;border-radius:20px;background:var(--card);box-shadow:var(--shadow);font-size:28px;display:grid;place-items:center}
.iconbtn:active{transform:translateY(3px)}
.bar h2{flex:1;margin:0;text-align:center;font-size:clamp(20px,5vw,30px);font-weight:800;line-height:1.05}
.bar h2 small{display:block;font-size:clamp(14px,3.4vw,17px);color:var(--muted);font-weight:700}
.pips{flex:none;height:58px;padding:0 14px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;gap:6px}
.pip{width:15px;height:15px;border-radius:50%;border:3px solid var(--sun)}
.pip.on{background:var(--sun)}
.spacer{width:58px;flex:none}

/* ---------- Meny og brett ---------- */
.menugrid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(140px,40vw,190px),1fr));gap:clamp(12px,3vw,20px);padding:12px 16px 150px;align-content:start;max-width:920px;width:100%;margin:0 auto}
.gtile{background:var(--card);border-radius:var(--r);padding:20px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:var(--shadow);border-bottom:8px solid var(--agec);transition:transform .15s}
.gtile:active{transform:scale(.96)}
.gtile .emo{font-size:clamp(50px,13vw,68px)}
.gtile .t{font-weight:700;font-size:clamp(16px,4vw,19px);line-height:1.15;text-align:center}
.gtile .prog{font-size:14px;font-weight:700;color:var(--muted)}
.lvgrid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(96px,24vw,130px),1fr));gap:clamp(16px,4vw,26px);padding:20px 20px 150px;align-content:start;max-width:760px;width:100%;margin:0 auto}
.lvbtn{aspect-ratio:1;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;border:6px solid var(--agec);transition:transform .15s}
.lvbtn:active{transform:scale(.94)}
.lvbtn.done{background:color-mix(in srgb,var(--sun) 30%,var(--card))}
.lvbtn.next{animation:glow 1.4s ease-in-out infinite}
.lvnum{font-size:clamp(36px,9vw,48px);font-weight:800;line-height:1}
.lvicon{font-size:clamp(20px,5vw,26px)}
.lvstar{position:absolute;top:-10px;right:-6px;font-size:32px}

/* ---------- Spillflate ---------- */
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,2.4vh,22px);padding:8px 12px 132px;overflow-y:auto;overflow-x:hidden}
.stage.locked{pointer-events:none}
.tile{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);display:grid;place-items:center;aspect-ratio:1;position:relative}
.tile .emo{font-size:clamp(50px,13vw,86px)}
.tile .badge{position:absolute;top:6px;right:8px;font-size:22px}
.g6{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,2.6vw,18px);width:min(94vw,540px,calc((100vh - 300px) * 1.5))}
.rowtiles{display:flex;gap:clamp(12px,3.5vw,26px);justify-content:center;flex-wrap:wrap}
.rowtiles .tile{width:clamp(100px,24vw,180px)}
.tile.right{background:color-mix(in srgb,var(--age2) 28%,var(--card))}
.pill{padding:12px 24px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-weight:700;font-size:19px}
.pill.go{background:var(--sun);color:#3a2a00}
.cbtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

/* Farger og former */
.field{display:grid;grid-template-columns:repeat(var(--c,3),1fr);gap:clamp(12px,3.5vw,28px);width:min(90vw,500px,calc((100vh - 280px) * 1.4))}
.cell{aspect-ratio:1;display:grid;place-items:center}
.shape{width:86%;height:86%;transition:transform .35s,opacity .35s;box-shadow:inset 0 -8px 0 rgba(0,0,0,.12)}
.shape.circle{border-radius:50%}
.shape.square{border-radius:16px}
.shape.triangle{clip-path:polygon(50% 6%,96% 92%,4% 92%);box-shadow:none}
.shape.gone{transform:scale(1.5) rotate(20deg);opacity:0;pointer-events:none}

/* Dra og slipp */
.draggable{touch-action:none;cursor:grab}
.dragging{z-index:60;position:relative;cursor:grabbing;filter:drop-shadow(0 12px 10px rgba(0,0,0,.22))}
.dragrow{display:flex;align-items:center;justify-content:center;gap:clamp(8px,4vw,40px);width:100%;flex-wrap:wrap}
.dragitems{display:flex;gap:clamp(10px,3vw,22px);justify-content:center;flex-wrap:wrap}
.dragtargets{display:flex;gap:clamp(10px,3vw,26px);justify-content:center;flex-wrap:wrap}
.item{font-size:clamp(56px,14vw,104px);width:clamp(92px,24vw,155px);aspect-ratio:1;display:grid;place-items:center;background:var(--card);border-radius:50%;box-shadow:var(--shadow)}
.dragitems .item{font-size:clamp(46px,11vw,76px);width:clamp(78px,19vw,118px)}
.target{position:relative;font-size:clamp(92px,24vw,165px);width:clamp(140px,38vw,235px);aspect-ratio:1;border-radius:40px;border:5px dashed var(--line);display:grid;place-items:center}
.target.sm{font-size:clamp(62px,15vw,110px);width:clamp(100px,26vw,170px)}
.inbox{position:absolute;left:0;right:0;bottom:3%;display:flex;justify-content:center;flex-wrap:wrap;pointer-events:none}
.inbox .item{width:auto;aspect-ratio:auto;background:none;box-shadow:none;font-size:.3em}
.arrow{font-size:clamp(34px,8vw,52px);color:var(--muted);font-weight:800;animation:nudge 1.1s ease-in-out infinite}
.arrow.down{animation:nudgey 1.1s ease-in-out infinite}

/* Musikk */
.xylo{display:flex;align-items:center;gap:clamp(5px,1.6vw,12px);height:min(42vh,320px);width:min(94vw,660px);touch-action:none}
.barx{flex:1;border-radius:16px;position:relative;box-shadow:inset 0 -10px 0 rgba(0,0,0,.14);transition:filter .2s}
.barx::before,.barx::after{content:"";position:absolute;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:rgba(255,255,255,.75)}
.barx::before{top:10%} .barx::after{bottom:12%}
.song .barx{filter:saturate(.45) brightness(1.05)}
.song .barx.lit{filter:none;box-shadow:inset 0 -10px 0 rgba(0,0,0,.14),0 0 0 6px #fff,0 0 0 12px var(--sun);animation:litpulse .9s ease-in-out infinite}
.instr{display:flex;gap:clamp(12px,4vw,24px);flex-wrap:wrap;justify-content:center}
.instr .tile{width:clamp(78px,20vw,112px)}
.instr .emo{font-size:clamp(40px,10vw,58px)}
.drums{display:flex;align-items:flex-end;gap:clamp(10px,3vw,24px);justify-content:center;flex-wrap:wrap}
.drum{border-radius:50%;aspect-ratio:1;box-shadow:inset 0 -12px 0 rgba(0,0,0,.18),0 0 0 8px #fff,var(--shadow)}

/* Puslespill */
.puzzle{display:flex;flex-direction:column;align-items:center;gap:18px}
.board{position:relative;width:max(240px,min(88vw,470px,calc((100vh - 400px) * 1.5)));aspect-ratio:3/2;border-radius:18px;background:var(--card);box-shadow:var(--shadow);overflow:hidden}
.ghost{position:absolute;inset:0;background-size:100% 100%;opacity:.2}
.slot{position:absolute;border:2px dashed var(--line)}
.tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:94vw}
.piece{width:var(--pw,100px);height:var(--ph,70px);background-repeat:no-repeat;border-radius:10px;box-shadow:0 4px 0 rgba(0,0,0,.18);border:2px solid #fff}
.piece.placed{position:absolute;border-radius:0;box-shadow:none;border:0}

/* Sortering */
.bins{display:flex;gap:clamp(8px,2.5vw,22px);width:min(96vw,680px)}
.bin{flex:1;background:var(--card);border-radius:var(--r);border:4px dashed var(--line);min-height:clamp(150px,25vh,220px);display:flex;flex-direction:column;align-items:center;padding:10px 6px;gap:2px}
.bin .head{font-size:clamp(36px,9vw,56px)}
.bin .lab{font-weight:700;font-size:clamp(16px,4vw,21px)}
.binbody{display:flex;flex-wrap:wrap;gap:2px;justify-content:center}
.sitem{font-size:clamp(44px,10.5vw,62px);width:clamp(70px,17vw,96px);aspect-ratio:1;display:grid;place-items:center;background:var(--card);border-radius:50%;box-shadow:var(--shadow);transition:opacity .3s,transform .3s}
.binbody .sitem{font-size:clamp(26px,6.5vw,38px);width:auto;padding:2px;background:none;box-shadow:none}
.stray{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:680px}

/* Memory */
.mem{display:grid;grid-template-columns:repeat(var(--c,4),1fr);gap:clamp(8px,2.2vw,14px);width:min(94vw,var(--mw,560px),calc((100vh - 250px) * var(--ar,1.3)))}
.card{aspect-ratio:3/4;perspective:800px}
.inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.open .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;box-shadow:var(--shadow)}
.back{background-color:var(--age3);background-image:radial-gradient(rgba(255,255,255,.22) 2px,transparent 2.6px);background-size:16px 16px}
.back svg{width:64%}
.front{background:var(--card);transform:rotateY(180deg);font-size:clamp(32px,9vw,58px)}
.card.matched .front{background:color-mix(in srgb,var(--age2) 30%,var(--card))}

/* Telling */
.target-num{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:var(--r);padding:6px 22px;box-shadow:var(--shadow)}
.bignum{font-size:clamp(56px,13vw,84px);font-weight:800;color:var(--berry);line-height:1}
.dots{display:flex;gap:7px;flex-wrap:wrap;max-width:140px}
.dot{width:20px;height:20px;border-radius:50%;border:3px solid var(--berry);transition:background .2s}
.dot.fill{background:var(--berry)}
.bush{width:min(90vw,450px);min-height:clamp(140px,22vh,200px);background:radial-gradient(circle at 30% 30%,#6FCB73,#3E9E54);border-radius:48% 52% 40% 44%/60% 60% 40% 40%;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:clamp(4px,1.6vw,10px);padding:18px 26px;box-shadow:inset 0 -10px 0 rgba(0,0,0,.12)}
.berry{font-size:clamp(40px,9.5vw,56px);transition:opacity .2s}
.bowl{display:flex;flex-direction:column;align-items:center}
.bowlin{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;min-height:46px;width:clamp(160px,40vw,240px)}
.bowlin .berry{font-size:32px}
.bowlimg{font-size:clamp(62px,14vw,88px);margin-top:-16px}

/* Felles svaralternativer */
.seq{display:flex;gap:clamp(4px,1.6vw,12px);background:var(--card);padding:clamp(10px,2vw,16px);border-radius:var(--r);box-shadow:var(--shadow)}
.pcell{width:clamp(42px,12vw,76px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:clamp(28px,8vw,52px)}
.pcell.q{border:4px dashed var(--muted);color:var(--muted);font-weight:800;font-family:'Baloo 2',sans-serif}
.opts{display:flex;gap:clamp(12px,4.5vw,30px);flex-wrap:wrap;justify-content:center}
.opt{width:clamp(80px,20vw,112px);aspect-ratio:1;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(42px,11vw,64px)}
.opt.txt{font-family:'Baloo 2',sans-serif;font-weight:800;color:var(--ink);line-height:1}
.opt.num{color:var(--berry)}
.opt .mini{font-size:14px;letter-spacing:1px;color:var(--muted);line-height:1}
.sw2{display:block;width:72%;height:72%;border-radius:50%}

/* Fargelegging */
.paper{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:8px;width:max(230px,min(92vw,500px,calc((100vh - 360px) * 1.25)))}
.paper svg{display:block;width:100%;height:auto}
.rg{cursor:pointer;transition:fill .2s}
.palette{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:560px}
.sw{width:clamp(40px,10vw,54px);aspect-ratio:1;border-radius:50%;border:4px solid var(--card);box-shadow:0 0 0 2px var(--line);transition:transform .15s}
.sw.sel{transform:scale(1.2);box-shadow:0 0 0 4px var(--ink)}

/* Påkledning */
.dressscene{position:relative;width:min(94vw,560px);border-radius:var(--r);padding:14px 12px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;overflow:hidden;color:#24344D}
.dressscene.sol{background:linear-gradient(#FFE59A,#FFF7DB)}
.dressscene.regn{background:linear-gradient(#9FB0C4,#DCE4EC)}
.dressscene.sno{background:linear-gradient(#C8E1F6,#F4FAFF)}
.dressscene.strand{background:linear-gradient(#BDE6FF 55%,#FFE7B3 55%)}
.weather{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;background:rgba(255,255,255,.78);padding:4px 18px;border-radius:999px;z-index:2}
.weather .emo{font-size:30px}
.toffewrap{--w:clamp(130px,30vw,190px);position:relative;width:var(--w);aspect-ratio:2/3;z-index:2}
.toffewrap svg{width:100%;height:100%;display:block}
.worn{position:absolute;transform:translate(-50%,-50%);animation:popin .45s cubic-bezier(.3,1.6,.5,1)}
.clothes{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;z-index:3}
.sitem.done{opacity:0;transform:scale(.4)!important;pointer-events:none}
.fallp{position:absolute;top:-20px;z-index:1;pointer-events:none}
.fallp.drop{width:3px;height:16px;border-radius:3px;background:rgba(60,90,140,.45);animation:fall 1.1s linear infinite}
.fallp.flake{color:#fff;font-size:18px;animation:fall 5s linear infinite;text-shadow:0 0 3px rgba(80,120,170,.6)}


/* Hvordan har Toffe det? */
.feelscene{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--card);border-radius:var(--r);padding:10px 26px;box-shadow:var(--shadow);font-size:clamp(56px,13vw,92px)}
.faces{display:flex;gap:clamp(10px,3vw,22px);flex-wrap:wrap;justify-content:center;max-width:720px}
.faceopt{width:clamp(100px,22vw,158px);aspect-ratio:1;border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;padding:8px}
.faceopt svg{width:100%;height:100%}
.faceopt.right{background:color-mix(in srgb,var(--age2) 28%,var(--card))}
.bigface{width:clamp(150px,34vw,230px);aspect-ratio:1}
.bigface svg{width:100%;height:100%}
.comfort{display:flex;gap:clamp(10px,3vw,20px);flex-wrap:wrap;justify-content:center}
.comfort .tile{width:clamp(96px,22vw,140px);display:flex;flex-direction:column;gap:2px}
.comfort .tile .emo{font-size:clamp(46px,11vw,66px)}
.comfort .tile .t{font-weight:700;font-size:16px;color:var(--muted)}


/* Tegn etter streken */
.drawbox{position:relative;background:#fff;border-radius:var(--r);box-shadow:var(--shadow);touch-action:none;flex:none;overflow:hidden}
.drawbox svg,.drawbox canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.drawbox .art{opacity:0;transition:opacity .9s}
.drawbox .art.show{opacity:1}
.gd{fill:none;stroke-linecap:round;stroke-linejoin:round}
.gd.cur{stroke:#E4508F;stroke-width:7;stroke-dasharray:1 14}
.gd.cur.faint{stroke:#C7D0DA;stroke-width:5;stroke-dasharray:none}
.gd.later{stroke:#D5DCE4;stroke-width:5;stroke-dasharray:1 12}
.gd.done{stroke:#24344D;stroke-width:4}
.startdot{fill:#3BB36C;transform-box:fill-box;transform-origin:center;animation:dotpulse 1s ease-in-out infinite}
@keyframes dotpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.4)}}
.crayons{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.crayons .sw{width:clamp(36px,9vw,48px)}

/* ---------- 5 år: bokstaver og tall ---------- */
.wordcard{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--card);border-radius:var(--r);padding:12px 24px 16px;box-shadow:var(--shadow)}
.wordcard .pic{font-size:clamp(70px,16vw,110px)}
.wordline{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.lt{min-width:clamp(40px,9vw,58px);height:clamp(52px,11vw,72px);padding:0 4px;border-radius:12px;background:var(--bg2);display:grid;place-items:center;font-size:clamp(32px,8vw,50px);font-weight:800;line-height:1}
.lt.q{border:3px dashed var(--muted);background:none;color:var(--muted)}
.lt.ghost{color:color-mix(in srgb,var(--ink) 25%,transparent)}
.lt.empty{background:none;border:3px dashed var(--line)}
.lt.filled{background:var(--sun);color:#3a2a00;border:0}
.eggs{display:grid;grid-template-columns:repeat(var(--c,3),1fr);gap:clamp(8px,2.4vw,16px);width:min(90vw,520px,calc((100vh - 280px) * .95))}
.egg{aspect-ratio:4/5;border-radius:50% 50% 46% 46%/60% 60% 40% 40%;box-shadow:inset -6px -8px 0 rgba(0,0,0,.08),var(--shadow);display:grid;place-items:center;font-size:clamp(30px,8vw,48px);font-weight:800;color:#24344D}
.egg.hatched{background:#FFE07A!important}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:620px}
.ltile{width:clamp(56px,13vw,78px);aspect-ratio:1;border-radius:16px;background:var(--card);box-shadow:var(--shadow);font-size:clamp(34px,8.5vw,50px);font-weight:800;display:grid;place-items:center;transition:opacity .2s,transform .2s}
.ltile.used{opacity:0;transform:scale(.5);pointer-events:none}
.traceinfo{display:flex;align-items:center;gap:12px;font-size:clamp(20px,5vw,26px);font-weight:800;background:var(--card);padding:6px 20px;border-radius:999px;box-shadow:var(--shadow);max-width:94vw;flex-wrap:wrap;justify-content:center}
.traceinfo .emo{font-size:clamp(26px,6vw,36px)}
.tracebox{position:relative;border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);touch-action:none;flex:none}
.tracebox canvas{position:absolute;inset:0;display:block;touch-action:none}
.pens{display:flex;gap:12px;width:min(94vw,660px)}
.pen{background:#A8DB8E;border:8px solid var(--wood);border-radius:22px;padding:12px;display:flex;flex-wrap:wrap;gap:4px 8px;justify-content:center;align-content:center;min-height:clamp(130px,22vh,190px);width:min(90vw,540px)}
.pens .pen{flex:1;width:auto}
.pen .a{font-size:clamp(32px,7.5vw,48px)}
.fence{display:flex;align-items:flex-end;gap:clamp(4px,1.5vw,10px);padding:30px 8px 0;position:relative;isolation:isolate}
.fence::before{content:"";position:absolute;left:0;right:0;top:56%;height:14px;background:var(--wood);border-radius:6px;z-index:-1}
.post{width:clamp(52px,13.5vw,86px);height:clamp(100px,19vh,140px);background:#C98A57;clip-path:polygon(50% 0,100% 16%,100% 100%,0 100%,0 16%);display:flex;align-items:flex-start;justify-content:center;padding-top:22%}
.sign{background:#fff;color:#24344D;border-radius:10px;width:80%;aspect-ratio:1;display:grid;place-items:center;font-size:clamp(24px,6.5vw,40px);font-weight:800}
.sign.q{background:#FFF1F6;border:3px dashed var(--berry);color:var(--berry)}
.sign.later{background:#F4F4F4;border:3px dashed #BBB;color:#999}
.sign.filled{background:var(--sun);color:#3a2a00}
.sitter{position:absolute;top:-6px;font-size:clamp(34px,8vw,48px);z-index:2}
.eq{display:flex;align-items:center;gap:clamp(6px,2vw,14px);flex-wrap:wrap;justify-content:center;background:var(--card);border-radius:var(--r);padding:12px 18px;box-shadow:var(--shadow);max-width:96vw}
.grp{display:flex;flex-wrap:wrap;max-width:clamp(110px,30vw,230px);gap:2px;justify-content:center;font-size:clamp(28px,7vw,44px)}
.grp .a{transition:opacity .6s,transform .6s}
.grp .a.leaving{opacity:.22;transform:translateX(16px) scale(.85)}
.grp.arrive .a{animation:arrive .7s ease-out both}
.op{font-size:clamp(34px,8vw,52px);font-weight:800;color:var(--muted)}
.eqline{font-size:clamp(36px,9vw,56px);font-weight:800;display:flex;gap:12px;align-items:center;background:var(--card);border-radius:999px;padding:2px 26px;box-shadow:var(--shadow)}
.eqline .qq{min-width:1.2em;text-align:center;border-bottom:4px dashed var(--berry);color:var(--berry)}

/* ---------- Guiden ---------- */
#guide{position:absolute;left:10px;bottom:10px;display:flex;align-items:flex-end;gap:6px;z-index:30;pointer-events:none}
#guide[hidden]{display:none}
.gchar{width:clamp(76px,18vw,104px);pointer-events:auto;cursor:pointer;transform-origin:50% 100%}
.bubble{background:var(--card);border-radius:22px 22px 22px 6px;padding:10px 16px;font-size:clamp(16px,4vw,20px);font-weight:600;line-height:1.25;box-shadow:var(--shadow);max-width:min(64vw,380px);margin-bottom:36px}
.bubble:empty{display:none}
#guide.talk .gchar{animation:talk .45s ease-in-out 3}
#guide.cheer .gchar{animation:jump .6s ease 2}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}

/* ---------- Lag og effekter ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.part{position:absolute;font-size:30px;animation:burst 1.3s ease-out forwards}
.floaty{position:absolute;transform:translate(-50%,-50%);font-weight:800;font-size:24px;color:var(--berry);animation:floaty 1.1s ease-out forwards;white-space:nowrap;text-shadow:0 2px 0 var(--card)}
.overlay{position:absolute;inset:0;background:rgba(20,32,48,.6);display:none;align-items:center;justify-content:center;z-index:80;padding:20px}
.overlay.show{display:flex}
.panel{background:var(--card);border-radius:30px;padding:24px;max-width:460px;width:100%;box-shadow:var(--shadow);text-align:left}
.panel h3{margin:0 0 6px;font-size:28px;font-weight:800}
.panel p{margin:6px 0 14px;color:var(--muted);line-height:1.35;font-size:16px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:2px solid var(--line);font-weight:600;font-size:18px}
.seg{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.seg button{padding:6px 14px;border-radius:12px;background:var(--bg2);font-weight:700;font-size:16px}
.seg button.on{background:var(--age3);color:#fff}
.center{text-align:center}
.crew{display:flex;justify-content:center;gap:6px;margin:4px 0 8px}
.crew svg{width:74px}
.crew.jump svg{animation:hop 1s ease-in-out infinite}
.crew.jump svg:nth-child(2){animation-delay:.15s} .crew.jump svg:nth-child(3){animation-delay:.3s} .crew.jump svg:nth-child(4){animation-delay:.45s}
.zz{font-size:28px;font-weight:800;color:var(--muted)}
.bigstars{font-size:44px;margin:4px 0 14px}
.donebtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

.boing{animation:boing .5s}
.shake{animation:shake .45s}
.glow{animation:glow 1.2s ease-in-out infinite}

@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes wave{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes talk{0%,100%{transform:scale(1)}50%{transform:scale(1.05,.95)}}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-26px) rotate(-6deg)}70%{transform:translateY(0) scale(1.08,.92)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes boing{0%{transform:scale(1)}30%{transform:scale(1.16,.86)}55%{transform:scale(.93,1.08)}80%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes glow{0%,100%{box-shadow:var(--shadow),0 0 0 0 rgba(255,201,60,0)}50%{box-shadow:var(--shadow),0 0 0 12px rgba(255,201,60,.65)}}
@keyframes litpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes nudge{0%,100%{transform:translateX(-6px)}50%{transform:translateX(8px)}}
@keyframes nudgey{0%,100%{transform:translateY(-4px) rotate(90deg)}50%{transform:translateY(6px) rotate(90deg)}}
@keyframes popin{0%{transform:translate(-50%,-50%) scale(.2)}100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes arrive{0%{transform:translateX(60px);opacity:0}100%{transform:none;opacity:1}}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.2) rotate(var(--rot));opacity:0}}
@keyframes floaty{0%{transform:translate(-50%,-50%);opacity:1}100%{transform:translate(-50%,-190%);opacity:0}}
@keyframes fall{to{transform:translateY(760px)}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="app">

  <section id="home" class="screen active">
    <div class="parent"><button class="holdbtn" id="parentBtn" aria-label="Voksenmeny, hold inne">⚙️ Voksne: hold inne</button></div>
    <h1 class="logo"><span>Lekekroken</span></h1>
    <div class="trio" id="trio"></div>
    <div class="ages">
      <button class="agebtn a2" data-age="2"><span class="candles emo">🕯️🕯️</span><span class="num">2</span><span class="lbl">Jeg er 2 år</span></button>
      <button class="agebtn a3" data-age="3"><span class="candles emo">🕯️🕯️🕯️</span><span class="num">3</span><span class="lbl">Jeg er 3 år</span></button>
      <button class="agebtn a5" data-age="5"><span class="candles emo">🐄🚜</span><span class="num">5</span><span class="lbl">Jeg er 5 år</span></button>
    </div>
  </section>

  <section id="menu" class="screen">
    <div class="bar">
      <button class="iconbtn" id="menuBack" aria-label="Tilbake til forsiden">🏠</button>
      <h2 id="menuTitle">Velg et spill</h2>
      <div class="spacer"></div>
    </div>
    <div class="menugrid" id="menuGrid"></div>
  </section>

  <section id="levels" class="screen">
    <div class="bar">
      <button class="iconbtn" id="lvBack" aria-label="Tilbake til spillene">⬅️</button>
      <h2 id="lvTitle"></h2>
      <div class="spacer"></div>
    </div>
    <div class="lvgrid" id="lvGrid"></div>
  </section>

  <section id="game" class="screen">
    <div class="bar">
      <button class="iconbtn" id="gameBack" aria-label="Tilbake til brettene">⬅️</button>
      <h2 id="gameTitle"></h2>
      <div class="pips" id="pips" aria-label="Runder"></div>
      <button class="iconbtn" id="repeatBtn" aria-label="Hør igjen">🔊</button>
    </div>
    <div class="stage" id="stage"></div>
  </section>

  <div id="guide" hidden><div class="gchar" id="gchar"></div><div class="bubble" id="bubble"></div></div>

  <div class="overlay" id="doneOv">
    <div class="panel center">
      <div class="crew jump" id="jumpers"></div>
      <h3 id="doneTitle">Brettet er ferdig!</h3>
      <div class="bigstars emo">⭐⭐⭐</div>
      <div class="donebtns">
        <button class="pill" id="doneLevels">Velg brett</button>
        <button class="pill go" id="doneNext">Neste brett <span class="emo">▶️</span></button>
      </div>
    </div>
  </div>

  <div class="overlay" id="parentOv">
    <div class="panel">
      <h3>For voksne</h3>
      <p id="voiceInfo">Appen bruker talesyntesen som finnes på enheten.</p>
      <div class="setrow"><span>Stemme</span><div class="seg" data-set="voice"><button data-v="true">På</button><button data-v="false">Av</button></div></div>
      <div class="setrow"><span>Lyder</span><div class="seg" data-set="sound"><button data-v="true">På</button><button data-v="false">Av</button></div></div>
      <div class="setrow"><span>Pause etter</span><div class="seg" data-set="pause"><button data-v="0">Av</button><button data-v="10">10 min</button><button data-v="15">15 min</button><button data-v="20">20 min</button></div></div>
      <div class="setrow"><span>Fullførte brett</span><div class="seg"><button id="resetProg">Nullstill</button></div></div>
      <div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="pill go" id="parentClose">Lukk</button></div>
    </div>
  </div>

  <div class="overlay" id="pauseOv">
    <div class="panel center">
      <div class="crew" id="sleepers"></div>
      <div class="zz">z z z</div>
      <h3>Pausetid!</h3>
      <p>Nå har vi lekt lenge. Figurene skal hvile litt, og det kan du også.</p>
      <button class="holdbtn" id="pauseContinue">Voksne: hold inne for å fortsette</button>
    </div>
  </div>

  <div id="fx"></div>
</div>

<script>
/* =========================================================
   Figurene: Toffe (bjørn), Pling (fugl), Nuppe (frosk) og Mølle (ku på gården)
   ========================================================= */
const CHARS = {

    <ellipse cx="60" cy="68" rx="46" ry="43" fill="#B77A4F"/>
    <ellipse cx="60" cy="84" rx="23" ry="17" fill="#EFCCA6"/>

    <g class="eyes"><circle cx="43" cy="58" r="6.5" fill="#2B1E18"/><circle cx="77" cy="58" r="6.5" fill="#2B1E18"/><circle cx="45" cy="56" r="2.2" fill="#fff"/><circle cx="79" cy="56" r="2.2" fill="#fff"/></g>
    <circle cx="31" cy="76" r="6" fill="#F28B82" opacity=".55"/><circle cx="89" cy="76" r="6" fill="#F28B82" opacity=".55"/>`},
  pling: { name:'Pling', art:`
    <path d="M56 26 Q48 10 57 5 Q60 15 62 22 Q68 8 78 10 Q70 17 66 27Z" fill="#2F7FC7"/>
    <ellipse cx="17" cy="72" rx="12" ry="19" fill="#3F8FD6" transform="rotate(22 17 72)"/>
    <ellipse cx="103" cy="72" rx="12" ry="19" fill="#3F8FD6" transform="rotate(-22 103 72)"/>
    <circle cx="60" cy="66" r="44" fill="#5AAEEB"/>
    <ellipse cx="60" cy="86" rx="26" ry="20" fill="#D4ECFF"/>
    <g class="eyes"><circle cx="44" cy="56" r="11" fill="#fff"/><circle cx="76" cy="56" r="11" fill="#fff"/><circle cx="46" cy="57" r="5.5" fill="#1D2A3A"/><circle cx="74" cy="57" r="5.5" fill="#1D2A3A"/><circle cx="48" cy="55" r="2" fill="#fff"/><circle cx="76" cy="55" r="2" fill="#fff"/></g>
    <path d="M51 68 L69 68 L60 81Z" fill="#FFB02E" stroke="#FFB02E" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="31" cy="73" r="6" fill="#F28B82" opacity=".5"/><circle cx="89" cy="73" r="6" fill="#F28B82" opacity=".5"/>
    <path d="M50 108 l-5 8 M50 108 l0 9 M70 108 l5 8 M70 108 l0 9" stroke="#FFB02E" stroke-width="3.5" stroke-linecap="round"/>`},
  nuppe: { name:'Nuppe', art:`
    <circle cx="36" cy="40" r="18" fill="#63BF62"/><circle cx="84" cy="40" r="18" fill="#63BF62"/>
    <ellipse cx="60" cy="76" rx="50" ry="37" fill="#63BF62"/>
    <ellipse cx="60" cy="90" rx="30" ry="16" fill="#BDE8AC"/>
    <circle cx="58" cy="54" r="3.5" fill="#4FA64F"/><circle cx="70" cy="60" r="2.5" fill="#4FA64F"/><circle cx="48" cy="62" r="2.5" fill="#4FA64F"/>
    <g class="eyes"><circle cx="36" cy="38" r="11" fill="#fff"/><circle cx="84" cy="38" r="11" fill="#fff"/><circle cx="37" cy="40" r="5.5" fill="#1F2A1F"/><circle cx="83" cy="40" r="5.5" fill="#1F2A1F"/><circle cx="39" cy="38" r="2" fill="#fff"/><circle cx="85" cy="38" r="2" fill="#fff"/></g>
    <path d="M34 70 Q60 90 86 70" fill="none" stroke="#2E6B30" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="24" cy="72" r="6" fill="#F28B82" opacity=".5"/><circle cx="96" cy="72" r="6" fill="#F28B82" opacity=".5"/>`},
  molle: { name:'Mølle', art:`
    <path d="M34 30 Q22 16 30 8 Q36 20 44 26Z" fill="#F1DFA8"/><path d="M86 30 Q98 16 90 8 Q84 20 76 26Z" fill="#F1DFA8"/>
    <ellipse cx="17" cy="50" rx="15" ry="8" fill="#FAFAFA" stroke="#D5D5D5" stroke-width="2" transform="rotate(-18 17 50)"/>
    <ellipse cx="103" cy="50" rx="15" ry="8" fill="#FAFAFA" stroke="#D5D5D5" stroke-width="2" transform="rotate(18 103 50)"/>
    <ellipse cx="60" cy="62" rx="40" ry="44" fill="#FFFFFF" stroke="#D5D5D5" stroke-width="2"/>
    <path d="M30 38 Q38 22 54 30 Q52 46 36 48Z" fill="#3D3D3D"/>
    <path d="M86 58 Q98 54 98 68 Q90 74 84 68Z" fill="#3D3D3D"/>
    <g class="eyes"><circle cx="45" cy="56" r="6.5" fill="#2B2B2B"/><circle cx="75" cy="56" r="6.5" fill="#2B2B2B"/><circle cx="47" cy="54" r="2.2" fill="#fff"/><circle cx="77" cy="54" r="2.2" fill="#fff"/></g>
    <ellipse cx="60" cy="86" rx="30" ry="19" fill="#F7B5C3"/>
    <ellipse cx="50" cy="83" rx="4" ry="5.5" fill="#C9788A"/><ellipse cx="70" cy="83" rx="4" ry="5.5" fill="#C9788A"/>

const charSVG = id => `<svg viewBox="0 0 120 120" aria-hidden="true">${CHARS[id].art}</svg>`;

const TOFFE_FULL = `<svg viewBox="0 0 200 300" aria-hidden="true">
  <circle cx="52" cy="40" r="22" fill="#9C6440"/><circle cx="52" cy="40" r="11" fill="#EBC29A"/>
  <circle cx="148" cy="40" r="22" fill="#9C6440"/><circle cx="148" cy="40" r="11" fill="#EBC29A"/>
  <ellipse cx="40" cy="195" rx="17" ry="38" fill="#A86E46" transform="rotate(22 40 195)"/>
  <ellipse cx="160" cy="195" rx="17" ry="38" fill="#A86E46" transform="rotate(-22 160 195)"/>
  <ellipse cx="78" cy="268" rx="24" ry="26" fill="#A86E46"/><ellipse cx="122" cy="268" rx="24" ry="26" fill="#A86E46"/>
  <ellipse cx="100" cy="196" rx="58" ry="68" fill="#B77A4F"/>
  <ellipse cx="100" cy="206" rx="36" ry="44" fill="#EFCCA6"/>
  <circle cx="100" cy="86" r="62" fill="#B77A4F"/>
  <ellipse cx="100" cy="108" rx="28" ry="20" fill="#EFCCA6"/>
  <ellipse cx="100" cy="98" rx="10" ry="7" fill="#3A2820"/>
  <path d="M89 112 Q100 122 111 112" fill="none" stroke="#3A2820" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="78" cy="76" r="8" fill="#2B1E18"/><circle cx="122" cy="76" r="8" fill="#2B1E18"/>
  <circle cx="81" cy="73" r="2.6" fill="#fff"/><circle cx="125" cy="73" r="2.6" fill="#fff"/>
  <circle cx="60" cy="102" r="9" fill="#F28B82" opacity=".5"/><circle cx="140" cy="102" r="9" fill="#F28B82" opacity=".5"/>
</svg>`;

/* =========================================================
   Hjelpefunksjoner
   ========================================================= */
const $ = s => document.querySelector(s);
const h = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const rand = a => a[Math.floor(Math.random() * a.length)];
const randInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

let ac = null;
function actx(){
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
  if (ac && ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(f, d = .2, type = 'sine', v = .18, at = 0, f2){
  if (!settings.sound) return;
  const c = actx(); if (!c) return;
  const t = c.currentTime + at;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(v, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(c.destination);
  o.start(t); o.stop(t + d + 0.05);
}

let nbVoice = null;
function pickVoice(){
  try {
    const vs = speechSynthesis.getVoices();
    nbVoice = vs.find(v => /^(nb|no|nn)([-_]|$)/i.test(v.lang)) || vs.find(v => /norw|norsk/i.test(v.name)) || null;
  } catch (e) {}
}

let instruction = '', talkTimer = null;
function say(text){
  $('#bubble').textContent = text;
  const g = $('#guide'); g.classList.remove('talk'); void g.offsetWidth; g.classList.add('talk');
  clearTimeout(talkTimer); talkTimer = setTimeout(() => g.classList.remove('talk'), 1500);
  if (!settings.voice || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'nb-NO'; if (nbVoice) u.voice = nbVoice;
    u.rate = .92; u.pitch = 1.15;

  } catch (e) {}
}

  const a = el.getBoundingClientRect();
  parent.appendChild(el);
  el.style.transition = 'none'; el.style.transform = '';
  const b = el.getBoundingClientRect();
  el.style.transform = `translate(${a.left - b.left}px,${a.top - b.top}px)`;
  void el.offsetWidth;
  el.style.transition = 'transform .35s ease'; el.style.transform = '';
}

/* ---------- Dra og slipp ---------- */
function draggable(el, onDrop){
  el.classList.add('draggable');
  el.addEventListener('pointerdown', e => {
    if (el.classList.contains('done')) return;
    e.preventDefault(); actx();
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    const sx = e.clientX, sy = e.clientY;
    el.style.transition = 'none'; el.classList.add('dragging'); sfx.tap();
    const move = ev => { el.style.transform = `translate(${ev.clientX - sx}px,${ev.clientY - sy}px) scale(1.1)`; };
    const up = ev => {
      el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up);
      el.classList.remove('dragging');
      const ok = ev.type === 'pointerup' && onDrop(el, ev.clientX, ev.clientY);
      if (!ok) { el.style.transition = 'transform .35s cubic-bezier(.3,1.5,.5,1)'; el.style.transform = ''; }
    };
    el.addEventListener('pointermove', move); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  });
}
function hit(target, x, y, pad = 40){
  const r = target.getBoundingClientRect();
  return x > r.left - pad && x < r.right + pad && y > r.top - pad && y < r.bottom + pad;
}
function holdButton(btn, ms, onDone){
  let t = null;
  btn.style.setProperty('--hold', ms + 'ms');
  btn.addEventListener('pointerdown', e => { e.preventDefault(); btn.classList.add('holding'); t = setTimeout(() => { btn.classList.remove('holding'); onDone(); }, ms); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev => btn.addEventListener(ev, () => { clearTimeout(t); btn.classList.remove('holding'); }));
  btn.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onDone(); } });
}

  values.forEach(v => { const b = h('button', cls, render(v)); b.onclick = () => { actx(); onPick(v, b); }; ob.append(b); });
  return ob;
}
function numOptions(correct, lo, hi, count = 3){
  const near = shuffle([-2, -1, 1, 2].map(d => correct + d).filter(x => x >= lo && x <= hi));
  const extra = [];
  for (let x = lo; x <= hi && near.length + extra.length < count - 1; x++) if (x !== correct && !near.includes(x)) extra.push(x);
  return shuffle([correct, ...[...near, ...extra].slice(0, count - 1)]);
}

function rSurprise(st, n, g, lv){
  sayInstr(lv.instr);
  const grid = h('div', 'g6'); const seen = new Set(); let finished = false;
  lv.items.forEach(a => {
    const t = h('button', 'tile', `<span class="emo">${a.e}</span>`);
    t.setAttribute('aria-label', a.n);
    t.onclick = () => {
      actx(); sfx.pop(); boing(t); floatUp(t, cap(a.s) + '!'); say(`${cap(a.n)} sier ${a.s}!`);
      if (!seen.has(a)) { seen.add(a); t.append(h('span', 'badge emo', '⭐')); }
      if (seen.size === lv.items.length && !finished) { finished = true; later(() => win('Du har hilst på alle sammen!'), 1600); }
    };
    grid.append(t);
  });
  st.append(grid);
}

function rFind(st, n, g, lv){
  const pool = lv.pool === 'all' ? Object.values(SETS).flatMap(s => s.items) : SETS[lv.pool].items;
  let opts; do { opts = shuffle(pool).slice(0, lv.count); } while (opts.every(o => o.e === g.st.last));
  const target = pickNew(opts, opts.find(o => o.e === g.st.last)); g.st.last = target.e;
  sayInstr(`Hvor er ${target.n}?`);
  const row = h('div', 'rowtiles');
  const tiles = opts.map(a => {
    const t = h('button', 'tile', `<span class="emo">${a.e}</span>`);
    t.onclick = () => {
      if (a === target) { t.classList.add('right'); boing(t); win(`Ja! Der er ${target.n}! ${cap(target.s)}!`); }
      else { sfx.hint(); shake(t); say(`Det er ${a.n}. Hvor er ${target.n}?`); tiles[opts.indexOf(target)].classList.add('glow'); }
    };
    row.append(t); return t;
  });
  st.append(row);
}

function rColors(st, n, g, lv){
  const mode = lv.mode === 'mix' ? (n % 2 ? 'shape' : 'color') : lv.mode;
  const items = []; const others = lv.total - 3; let okText, noText;
  if (mode === 'color') {
    const picks = shuffle(lv.pool === 'all' ? COLORS : COLORS.slice(0, 4)).slice(0, lv.k);
    const tc = picks[0], rest = picks.slice(1);
    for (let i = 0; i < 3; i++) items.push({c:tc.c, s:rand(SHAPES).k, t:true});
    for (let i = 0; i < others; i++) { const oc = rest[i % rest.length]; items.push({c:oc.c, s:rand(SHAPES).k, col:oc}); }
    sayInstr(`Trykk på alt som er ${tc.nt}!`);
    okText = () => cap(tc.n) + '!'; noText = it => `Den er ${it.col.n}. Finn det som er ${tc.nt}!`;
  } else {
    const picks = shuffle(SHAPES).slice(0, lv.k); const ts = picks[0], rest = picks.slice(1);
    for (let i = 0; i < 3; i++) items.push({c:rand(COLORS).c, s:ts.k, t:true});
    for (let i = 0; i < others; i++) { const os = rest[i % rest.length]; items.push({c:rand(COLORS).c, s:os.k, sh:os}); }
    sayInstr(`Trykk på alle ${ts.pl}!`);
    okText = () => `En ${ts.n}!`; noText = it => `Det er en ${it.sh.n}. Finn ${ts.pl}!`;
  }
  const field = h('div', 'field'); field.style.setProperty('--c', lv.total === 8 ? 4 : 3);
  let left = 3;
  shuffle(items).forEach(it => {
    const cell = h('div', 'cell'); const sh = h('button', 'shape ' + it.s);
    sh.style.background = it.c;
    sh.onclick = () => {
      if (it.t) { sfx.pop(); floatUp(sh, '⭐'); sh.classList.add('gone'); left--; if (left === 0) later(() => win(), 350); else say(okText()); }
      else { sfx.hint(); shake(sh); say(noText(it)); }
    };
    cell.append(sh); field.append(cell);
  });
  st.append(field);
}

function rDrag(st, n, g, lv){
  const task = lv.tasks[n % lv.tasks.length];
  sayInstr(task.text);
  const many = task.targets.length > 1 || task.items.length > 1;
  const tEls = task.targets.map(e => {
    const t = h('div', 'target emo' + (task.targets.length > 1 ? ' sm' : ''), e);
    const box = h('div', 'inbox'); t.append(box); return {t, box};
  });
  const iEls = task.items.map(it => h('div', 'item emo', it.e));
  if (many) {
    const ir = h('div', 'dragitems'); iEls.forEach(e => ir.append(e));
    const tr = h('div', 'dragtargets'); tEls.forEach(o => tr.append(o.t));
    st.append(ir, h('div', 'arrow down', '➜'), tr);
  } else {
    const row = h('div', 'dragrow'); row.append(iEls[0], h('div', 'arrow', '➜'), tEls[0].t); st.append(row);
  }
  let left = task.items.length;
  task.items.forEach((it, i) => draggable(iEls[i], (d, x, y) => {
    const idx = tEls.findIndex(o => hit(o.t, x, y, task.targets.length > 1 ? 25 : 70));
    if (idx === it.t) {
      d.classList.add('done'); flyInto(d, tEls[idx].box); sfx.pop(); boing(tEls[idx].t); left--;
      if (!left) { st.querySelectorAll('.arrow').forEach(a => a.style.visibility = 'hidden'); later(() => win(task.done), 350); }
      else say(rand(['Ja!','Flott!','En til!']));
      return true;
    }
    sfx.hint();
    if (idx >= 0) { shake(tEls[idx].t); say('Hmm, vil den ha det? Prøv et annet sted!'); } else say(task.text);
    return false;
  }));
}

function buildXylo(onPlay){
  const x = h('div', 'xylo');
  const bars = NOTES.map((f, i) => { const b = h('div', 'barx'); b.style.background = BAR_COLORS[i]; b.style.height = (100 - i * 6) + '%'; b.dataset.i = i; x.append(b); return b; });
  let down = false, last = null;
  const play = b => { if (!b || b === last) return; last = b; sfx.note(NOTES[+b.dataset.i]); boing(b); floatUp(b, rand(['♪','♫'])); onPlay(b, +b.dataset.i); };
  x.addEventListener('pointerdown', e => { e.preventDefault(); actx(); down = true; last = null; try { x.setPointerCapture(e.pointerId); } catch (err) {} play(e.target.closest('.barx')); });
  x.addEventListener('pointermove', e => { if (!down) return; const el = document.elementFromPoint(e.clientX, e.clientY); play(el && el.closest ? el.closest('.barx') : null); });
  const end = () => { down = false; last = null; };
  x.addEventListener('pointerup', end); x.addEventListener('pointercancel', end);
  return {x, bars};
}
function rMusic(st, n, g, lv){
  let plays = 0, finished = false;
  const count = () => { cheer(); plays++; if (plays >= 20 && !finished) { finished = true; later(() => win('For en konsert! Bravo!'), 900); } };
  if (lv.mode === 'xylo') {
    sayInstr('La oss spille musikk! Trykk på fargene.');
    const {x} = buildXylo(count); st.append(x);
  } else if (lv.mode === 'choir') {
    sayInstr('Dyrekoret! Trykk på dyrene, så synger de.');
    const grid = h('div', 'g6');
    CHOIR.forEach(a => {
      const t = h('button', 'tile', `<span class="emo">${a.e}</span>`);
      t.onclick = () => { actx(); sfx.note(a.f); boing(t); floatUp(t, a.s); count(); };
      grid.append(t);
    });
    st.append(grid);
  } else if (lv.mode === 'drums') {
    sayInstr('Trommer! Bom, bom, bom!');
    const d = h('div', 'drums');
    DRUMS.forEach(dr => {
      const b = h('button', 'drum'); b.style.background = dr.c; b.style.width = `calc(clamp(70px, 18vw, 130px) * ${dr.s})`;
      b.onclick = () => { actx(); sfx.drum(dr.f); boing(b); floatUp(b, 'Bom!'); count(); };
      d.append(b);
    });
    const inst = h('div', 'instr');
    [['🔔','bell','Pling!'], ['🐸','frog','Kvekk!']].forEach(([e, k, t]) => {
      const b = h('button', 'tile', `<span class="emo">${e}</span>`);
      b.onclick = () => { actx(); sfx[k](); boing(b); floatUp(b, t); count(); };
      inst.append(b);
    });
    st.append(d, inst);
  } else {
    const song = SONGS[lv.song]; let pos = 0, busy = false;
    sayInstr(`Trykk på fargen som lyser, så spiller du ${song.name}!`);
    const light = () => bars.forEach(b => b.classList.toggle('lit', +b.dataset.i === song.notes[pos]));
    const {x, bars} = buildXylo((b, i) => {
      if (busy || pos >= song.notes.length) return;
      if (i === song.notes[pos]) {
        pos++;
        if (pos >= song.notes.length) { bars.forEach(b2 => b2.classList.remove('lit')); later(() => win(`Du spilte ${song.name}!`), 600); }
        else light();
      }
    });
    x.classList.add('song');
    const listen = h('button', 'pill', '<span class="emo">👂</span> Hør sangen');
    listen.onclick = () => {
      if (busy) return; busy = true; actx(); bars.forEach(b => b.classList.remove('lit'));
      song.notes.forEach((ni, k) => later(() => { sfx.note(NOTES[ni]); boing(bars[ni]); }, k * 430));
      later(() => { busy = false; light(); }, song.notes.length * 430 + 200);
    };
    st.append(x, listen); light();
  }
}

function rPuzzle(st, n, g, lv){
  const cols = lv.cols, rows = lv.rows;
  const url = svgURL(PUZZLES[lv.pics[n]]());
  sayInstr(`Legg de ${NUMW[cols * rows]} bitene på plass!`);
  const wrap = h('div', 'puzzle'), board = h('div', 'board'), ghost = h('div', 'ghost');
  if (lv.ghost !== false) { ghost.style.backgroundImage = `url("${url}")`; board.append(ghost); }
  const slots = [], pieces = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const pos = {left:`${c / cols * 100}%`, top:`${r / rows * 100}%`, width:`${100 / cols}%`, height:`${100 / rows}%`};
    const slot = h('div', 'slot'); Object.assign(slot.style, pos); board.append(slot); slots.push({slot, pos});
    const p = h('div', 'piece');
    p.style.backgroundImage = `url("${url}")`;
    p.style.backgroundSize = `${cols * 100}% ${rows * 100}%`;
    p.style.backgroundPosition = `${c / (cols - 1) * 100}% ${r / (rows - 1) * 100}%`;
    p.dataset.k = r * cols + c; pieces.push(p);
  }
  const tray = h('div', 'tray'); shuffle(pieces).forEach(p => tray.append(p));
  wrap.append(board, tray); st.append(wrap);
  const scale = cols * rows > 6 ? .8 : .9;
  const size = () => { const r = board.getBoundingClientRect(); wrap.style.setProperty('--pw', r.width / cols * scale + 'px'); wrap.style.setProperty('--ph', r.height / rows * scale + 'px'); };
  size(); g.onResize = size;
  let placed = 0;
  pieces.forEach(p => draggable(p, (el, x, y) => {
    const {slot, pos} = slots[+el.dataset.k];
    const sr = slot.getBoundingClientRect();
    if (hit(slot, x, y, Math.min(sr.width, sr.height) * .3)) {
      const a = el.getBoundingClientRect();
      el.classList.add('done', 'placed'); board.append(el);
      el.style.transition = 'none'; el.style.transform = ''; Object.assign(el.style, pos);
      const b = el.getBoundingClientRect();
      el.style.transformOrigin = '0 0';
      el.style.transform = `translate(${a.left - b.left}px,${a.top - b.top}px) scale(${a.width / b.width})`;
      void el.offsetWidth; el.style.transition = 'transform .3s ease'; el.style.transform = '';
      sfx.pop(); placed++;
      if (placed === pieces.length) later(() => win('Du klarte puslespillet!'), 450);
      else say(rand(['Ja!','Der passet den!','Flott!']));
      return true;
    }
    sfx.hint();
    if (slots.some(s => hit(s.slot, x, y, 0))) say('Den passer et annet sted. Prøv igjen!');
    return false;
  }));
}

function makePaint(box, S, g, onStroke){
  const dpr = Math.min(window.devicePixelRatio || 1, 2), W = Math.round(S * dpr);
  const pc = document.createElement('canvas'); pc.width = pc.height = W;
  const px = pc.getContext('2d'); if (!px) return null;
  px.setTransform(dpr, 0, 0, dpr, 0, 0);
  const brush = S * .085;
  px.lineCap = 'round'; px.lineJoin = 'round'; px.lineWidth = brush;
  const setColor = c => { px.strokeStyle = px.fillStyle = c; };
  setColor(g.st.crayon || CRAYONS[0]);
  box.append(pc);
  let drawing = false, lx = 0, ly = 0;
  const pos = e => { const r = pc.getBoundingClientRect(); return [(e.clientX - r.left) * S / r.width, (e.clientY - r.top) * S / r.height]; };
  pc.addEventListener('pointerdown', e => { e.preventDefault(); actx(); drawing = true; try { pc.setPointerCapture(e.pointerId); } catch (err) {} [lx, ly] = pos(e); px.beginPath(); px.arc(lx, ly, brush / 2, 0, Math.PI * 2); px.fill(); });
  pc.addEventListener('pointermove', e => { if (!drawing) return; const [x, y] = pos(e); px.beginPath(); px.moveTo(lx, ly); px.lineTo(x, y); px.stroke(); lx = x; ly = y; });
  const end = () => { if (!drawing) return; drawing = false; if (onStroke) onStroke(); };
  pc.addEventListener('pointerup', end); pc.addEventListener('pointercancel', end);
  const clear = () => { px.save(); px.setTransform(1, 0, 0, 1, 0, 0); px.clearRect(0, 0, W, W); px.restore(); };
  return {px, W, dpr, clear, setColor};
}
function crayonRow(g, paint){
  const row = h('div', 'crayons');
  CRAYONS.forEach(c => {
    const s = h('button', 'sw' + (c === (g.st.crayon || CRAYONS[0]) ? ' sel' : '')); s.style.background = c; s.setAttribute('aria-label', 'Farge');
    s.onclick = () => { actx(); g.st.crayon = c; paint.setColor(c); row.querySelectorAll('.sw').forEach(x => x.classList.toggle('sel', x === s)); sfx.tap(); };
    row.append(s);
  });
  return row;
}
function rDraw(st, n, g, lv){
  const S = Math.round(Math.max(230, Math.min(innerWidth * .86, innerHeight - 360, 460)));
  const box = h('div', 'drawbox'); box.style.width = box.style.height = S + 'px';
  if (lv.free) {
    sayInstr('Tegn hva du vil! Velg en farge, og tegn med fingeren.');
    const paint = makePaint(box, S, g); if (!paint) return;
    const btns = h('div', 'cbtns');
    const clr = h('button', 'pill', '<span class="emo">🧽</span> Visk ut'); clr.onclick = () => { paint.clear(); sfx.tap(); };
    const done = h('button', 'pill go', '<span class="emo">⭐</span> Ferdig!'); done.onclick = () => win('For en fin tegning!');
    btns.append(clr, done);
    st.append(crayonRow(g, paint), box, btns); return;
  }
  const D = DRAWINGS[lv.pics[n]];
  box.innerHTML = `<svg viewBox="0 0 300 300" aria-hidden="true"><g class="art">${D.art}</g><g class="guidelines"></g></svg>`;
  const art = box.querySelector('.art'), gl = box.querySelector('.guidelines');
  let cur = 0, finished = false;
  const drawGuide = () => {
    gl.innerHTML = D.parts.map((p, i) => {
      if (i < cur) return `<path d="${p.d}" class="gd done"/>`;
      if (i > cur) return lv.faint ? '' : `<path d="${p.d}" class="gd later"/>`;
      const m = p.d.match(/M\s*([\d.]+)[\s,]+([\d.]+)/);
      return `<path d="${p.d}" class="gd cur${lv.faint ? ' faint' : ''}"/>` + (m ? `<circle cx="${m[1]}" cy="${m[2]}" r="11" class="startdot"/>` : '');
    }).join('');
  };
  let core = null, fat = null;
  const paint = makePaint(box, S, g, () => check());
  if (!paint) return;
  const {W, dpr} = paint, k = S / 300;
  const off = () => { const c = document.createElement('canvas'); c.width = c.height = W; const x = c.getContext('2d'); x.setTransform(dpr * k, 0, 0, dpr * k, 0, 0); x.lineCap = 'round'; x.lineJoin = 'round'; return x; };
  try {
    const step = Math.max(2, Math.round(3 * dpr));
    core = D.parts.map(p => {
      const x = off(); x.lineWidth = 3; x.stroke(new Path2D(p.d));
      const d = x.getImageData(0, 0, W, W).data, pts = [];
      for (let Y = 0; Y < W; Y += step) for (let X = 0; X < W; X += step) if (d[(Y * W + X) * 4 + 3] > 80) pts.push(Y * W + X);
      return pts;
    });
    const fx = off(); fx.lineWidth = 48; D.parts.forEach(p => fx.stroke(new Path2D(p.d)));
    fat = fx.getImageData(0, 0, W, W).data;
  } catch (e) { core = null; }
  const nb = Math.round(S * .03 * dpr);
  function check(){
    if (finished || !core) return;
    const pd = paint.px.getImageData(0, 0, W, W).data;
    const P = i => pd[i * 4 + 3] > 40;
    let tot = 0, out = 0;
    for (let Y = 0; Y < W; Y += 6) for (let X = 0; X < W; X += 6) { const i = Y * W + X; if (P(i)) { tot++; if (fat[i * 4 + 3] < 80) out++; } }
    const samples = Math.ceil(W / 6) ** 2;
    if (tot / samples > .5 || (tot > 60 && out / tot > .55)) { paint.clear(); sfx.hint(); say('Oi, så mange kruseduller! Vi visker ut og prøver igjen. ' + D.parts[cur].say); return; }
    let moved = false;
    while (cur < D.parts.length) {
      const pts = core[cur]; let c = 0;
      pts.forEach(i => { if (P(i) || P(i + nb) || P(i - nb) || P(i + nb * W) || P(i - nb * W)) c++; });
      if (pts.length && c / pts.length >= .62) { cur++; moved = true; sfx.pop(); } else break;
    }
    if (!moved) return;
    if (cur >= D.parts.length) { finished = true; gl.innerHTML = ''; art.classList.add('show'); boing(box); win(D.done); }
    else { drawGuide(); say('Flott! ' + D.parts[cur].say); }
  }
  drawGuide();
  sayInstr(D.parts[0].say + ' Start ved den grønne prikken.');
  const btns = h('div', 'cbtns');
  const clr = h('button', 'pill', '<span class="emo">🧽</span> Visk ut'); clr.onclick = () => { paint.clear(); sfx.tap(); };
  btns.append(clr);
  st.append(crayonRow(g, paint), box, btns);
}

  sayInstr(low ? `Hva begynner ${word} med? Finn den lille bokstaven.` : `Hva begynner ${word} med?`);
  const pool = shuffle([...new Set(FW.map(x => x.w[0]))].filter(c => c !== L));

function rEggs(st, n, g, lv){
  const L = lv.targets[n % lv.targets.length];
  const mode = lv.case || 'upper';
  const fmt = c => mode === 'lower' ? c.toLowerCase() : c;
  const pre = n === 0 ? 'Høna har lagt egg! ' : '';
  sayInstr(pre + (mode === 'lower' ? `Finn alle eggene med liten ${L}!` : mode === 'both' ? `Finn alle eggene med ${L}, både store og små!` : `Finn alle eggene med ${L}!`));
  const items = [];
  for (let i = 0; i < 3; i++) items.push({c: mode === 'both' ? (i === 0 ? L : i === 1 ? L.toLowerCase() : rand([L, L.toLowerCase()])) : fmt(L), t:true});
  const dpool = (lv.dis || ALPHA).filter(c => c !== L);
  for (let i = 0; i < lv.total - 3; i++) { const c = rand(dpool); items.push({c: mode === 'both' ? rand([c, c.toLowerCase()]) : fmt(c), t:false}); }
  const grid = h('div', 'eggs'); grid.style.setProperty('--c', lv.total > 9 ? 4 : 3);
  let left = 3;
  shuffle(items).forEach(it => {
    const e = h('button', 'egg', it.c); e.style.background = rand(EGG_COLORS);
    e.onclick = () => {
      if (e.classList.contains('hatched')) return; actx();
      if (it.t) { e.classList.add('hatched'); e.innerHTML = '<span class="emo">🐥</span>'; sfx.pop(); boing(e); left--; if (!left) later(() => win('Alle kyllingene har klekket!'), 400); else say(rand(['Pip pip!','Der var en!','Flott!'])); }
      else { sfx.hint(); shake(e); const low = it.c !== it.c.toUpperCase(); say(`Det er ${low ? 'liten ' : ''}${it.c.toUpperCase()}. Finn ${L}!`); }
    };
    grid.append(e);
  });
  st.append(grid);
}

function rWord(st, n, g, lv){
  if (n === 0) g.st.queue = shuffle(lv.words);
  const w = byWord(g.st.queue[n % g.st.queue.length]);
  const letters = [...w.w]; const word = w.w.toLowerCase();
  sayInstr(lv.ghost ? `Bygg ordet ${word}! Trykk på bokstavene i riktig rekkefølge.` : `Kan du skrive ${word}? Hør godt etter lydene.`);
  const slots = letters.map(c => h('div', 'lt ' + (lv.ghost ? 'ghost' : 'empty'), lv.ghost ? c : ''));
  const extras = shuffle(ALPHA.filter(c => !letters.includes(c))).slice(0, lv.extra || 0);
  const tiles = h('div', 'tiles');
  let pos = 0, misses = 0;
  const tileEls = shuffle([...letters, ...extras]).map(c => {
    const b = h('button', 'ltile', c);
    b.onclick = () => {
      if (pos >= letters.length) return; actx();
      if (c === letters[pos]) {
        b.classList.add('used'); slots[pos].className = 'lt filled'; slots[pos].textContent = c; boing(slots[pos]); sfx.pop(); say(c);
        pos++; misses = 0; tileEls.forEach(t => t.classList.remove('glow'));
        if (pos === letters.length) { st.classList.add('locked'); later(() => win(`${cap(word)}! Du skrev ${word}!`), 700); }
      } else {
        sfx.hint(); shake(b); misses++;
        say(lv.ghost ? `Se på ordet. Vi trenger ${letters[pos]}.` : `Hør: ${word}. Hvilken lyd kommer nå?`);
        if (misses >= 2) { const right = tileEls.find(t => !t.classList.contains('used') && t.textContent === letters[pos]); if (right) right.classList.add('glow'); }
      }
    };
    tiles.append(b); return b;
  });
  st.append(wordCard(w, slots), tiles);
}

function rTrace(st, n, g, lv){
  const ch = lv.items[n]; const isNum = /\d/.test(ch);
  let label, line;
  if (isNum) { const k = +ch; label = `<span class="emo">${'🐑'.repeat(k)}</span>`; line = `Skriv tallet ${NUMW[k]}! Følg tallet med fingeren.`; }
  else { const w = byWord(TRACE_WORDS[ch]); label = `<span class="emo">${w.e}</span><span>${ch} som i ${w.w}</span>`; line = `Skriv ${ch}, som i ${w.w.toLowerCase()}! Følg bokstaven med fingeren.`; }
  sayInstr(line);
  const S = Math.round(Math.max(220, Math.min(innerWidth * .84, innerHeight - 340, 440)));
  const dpr = Math.min(window.devicePixelRatio || 1, 2); const W = Math.round(S * dpr);
  const mk = () => { const c = document.createElement('canvas'); c.width = c.height = W; c.style.width = c.style.height = S + 'px'; const x = c.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0); return [c, x]; };
  const box = h('div', 'tracebox'); box.style.width = box.style.height = S + 'px';
  const [gc, gx] = mk(), [pc, px] = mk(); if (!gx || !px) return; box.append(gc, pc);
  const btns = h('div', 'cbtns'); const clr = h('button', 'pill', '<span class="emo">🧽</span> Visk ut'); btns.append(clr);
  st.append(h('div', 'traceinfo', label), box, btns);
  const css = getComputedStyle(document.documentElement);
  const font = `800 ${Math.round(S * .8)}px 'Baloo 2', 'Trebuchet MS', sans-serif`;
  let core = [], fat = null, done = false, baseY = S * .78;
  const place = x => { x.font = font; x.textAlign = 'center'; x.textBaseline = 'alphabetic'; const m = x.measureText(ch); const a = m.actualBoundingBoxAscent || S * .56, d = m.actualBoundingBoxDescent || 0; return S / 2 + (a - d) / 2; };
  const setup = () => {
    baseY = place(gx);
    gx.fillStyle = css.getPropertyValue('--bg2').trim() || '#D7EEE2'; gx.fillText(ch, S / 2, baseY);
    gx.setLineDash([10, 10]); gx.lineWidth = 3; gx.strokeStyle = css.getPropertyValue('--muted').trim() || '#6D7E93'; gx.strokeText(ch, S / 2, baseY);
    const [, mx] = mk(); place(mx); mx.fillStyle = '#000'; mx.fillText(ch, S / 2, baseY);
    const md = mx.getImageData(0, 0, W, W).data;
    const inM = (x, y) => { const X = Math.round(x * dpr), Y = Math.round(y * dpr); return X >= 0 && Y >= 0 && X < W && Y < W && md[(Y * W + X) * 4 + 3] > 100; };
    const d = S * .03;
    for (let y = 0; y < S; y += 4) for (let x = 0; x < S; x += 4) if (inM(x, y) && inM(x - d, y) && inM(x + d, y) && inM(x, y - d) && inM(x, y + d)) core.push([x, y]);
    if (core.length < 20) { core = []; for (let y = 0; y < S; y += 4) for (let x = 0; x < S; x += 4) if (inM(x, y)) core.push([x, y]); }
    const [, fx] = mk(); place(fx); fx.fillStyle = '#000'; fx.strokeStyle = '#000'; fx.lineWidth = S * .12; fx.lineJoin = 'round';
    fx.fillText(ch, S / 2, baseY); fx.strokeText(ch, S / 2, baseY);
    fat = fx.getImageData(0, 0, W, W).data;
  };
  const t0 = token;
  (document.fonts && document.fonts.load ? document.fonts.load(font).catch(() => {}) : Promise.resolve()).then(() => { if (t0 === token) setup(); });
  const brush = S * .09;
  px.lineCap = 'round'; px.lineJoin = 'round'; px.lineWidth = brush;
  px.strokeStyle = px.fillStyle = css.getPropertyValue('--berry').trim() || '#E4508F';
  let drawing = false, lx = 0, ly = 0;
  const pos = e => { const r = pc.getBoundingClientRect(); return [(e.clientX - r.left) * S / r.width, (e.clientY - r.top) * S / r.height]; };
  pc.addEventListener('pointerdown', e => {
    if (done) return; e.preventDefault(); actx(); drawing = true;
    try { pc.setPointerCapture(e.pointerId); } catch (err) {}
    [lx, ly] = pos(e); px.beginPath(); px.arc(lx, ly, brush / 2, 0, Math.PI * 2); px.fill();
  });
  pc.addEventListener('pointermove', e => { if (!drawing) return; const [x, y] = pos(e); px.beginPath(); px.moveTo(lx, ly); px.lineTo(x, y); px.stroke(); lx = x; ly = y; });
  const check = () => {
    if (!core.length || !fat || done) return;
    const pd = px.getImageData(0, 0, W, W).data;
    const idx = (x, y) => (Math.round(y * dpr) * W + Math.round(x * dpr)) * 4 + 3;
    let cov = 0; core.forEach(([x, y]) => { if (pd[idx(x, y)] > 40) cov++; });
    const coverage = cov / core.length;
    let tot = 0, out = 0;
    for (let y = 0; y < S; y += 5) for (let x = 0; x < S; x += 5) { const i = idx(x, y); if (pd[i] > 40) { tot++; if (fat[i] < 100) out++; } }
    const ratio = tot ? out / tot : 0;
    if (coverage >= .7 && ratio < .35) { done = true; win(isNum ? `Så fint! Det er tallet ${NUMW[+ch]}.` : `For en fin ${ch}!`); }
    else if (coverage >= .7) say('Nesten! Prøv å holde deg inni streken. Trykk på visk ut og prøv igjen.');
  };
  const end = () => { if (!drawing) return; drawing = false; check(); };
  pc.addEventListener('pointerup', end); pc.addEventListener('pointercancel', end);
  clr.onclick = () => { px.save(); px.setTransform(1, 0, 0, 1, 0, 0); px.clearRect(0, 0, W, W); px.restore(); sfx.tap(); };
}

function pen(animals){ const p = h('div', 'pen'); animals.forEach(a => p.append(h('span', 'a emo', a.e))); return p; }
function rCountFarm(st, n, g, lv){
  const A = rand(ANIM5);
  if (lv.mode === 'most' || lv.mode === 'least') {
    let a, b; do { a = randInt(1, lv.max); b = randInt(1, lv.max); } while (a === b);
    const most = lv.mode === 'most';
    sayInstr(most ? `Hvor er det flest ${A.pl}? Trykk på innhegningen.` : `Hvor er det færrest ${A.pl}? Trykk på innhegningen.`);
    const wrap = h('div', 'pens');
    const pa = pen(Array(a).fill(A)), pb = pen(Array(b).fill(A));
    const right = most ? (a > b ? pa : pb) : (a < b ? pa : pb);
    [pa, pb].forEach(p => { p.setAttribute('role', 'button'); p.style.cursor = 'pointer'; p.onclick = () => {
      actx();
      if (p === right) { boing(p); const [x, y] = p === pa ? [a, b] : [b, a]; win(`Ja! Her er det ${qty(x, A)}, og der er det ${qty(y, A)}.`); }
      else { sfx.hint(); shake(p); say('Tell dyrene i begge innhegningene, og prøv igjen.'); }
    }; wrap.append(p); });
    st.append(wrap); return;
  }
  let k; do { k = randInt(lv.min, lv.max); } while (k === g.st.last); g.st.last = k;
  let animals = Array(k).fill(A); let prompt = `Hvor mange ${A.pl} er det i innhegningen?`;
  if (lv.mode === 'mixed') {
    const B = rand(ANIM5.filter(x => x !== A)); animals = shuffle([...animals, ...Array(randInt(2, 4)).fill(B)]);
    prompt = `Hvor mange ${A.pl} ser du? Bare tell ${A.pl}!`;
  }
  sayInstr(prompt);
  const ob = optionButtons(numOptions(k, 1, lv.max + 2), v => v, (v, b) => {
    if (v === k) { boing(b); win(`Ja! Det er ${qty(k, A)}.`); }
    else { sfx.hint(); shake(b); say(`Tell en gang til. Pek på hver ${A.sg}.`); }
  }, 'opt txt num');
  st.append(pen(animals), ob);
}

function rFence(st, n, g, lv){
  const dir = lv.dir === 'mix' ? rand(['up','down']) : lv.dir;
  const len = 5; const start = randInt(lv.lo, lv.hi - len + 1);
  let seq = [...Array(len)].map((_, i) => start + i); if (dir === 'down') seq.reverse();
  const miss = shuffle([...Array(len).keys()].filter(i => !(lv.missing > 1 && i === 0))).slice(0, lv.missing).sort((a, b) => a - b);
  let cur = 0;
  const fence = h('div', 'fence');
  const signs = seq.map((v, i) => {
    const p = h('div', 'post'); const s = h('div', 'sign', miss.includes(i) ? '?' : String(v));
    if (miss.includes(i)) s.classList.add(i === miss[0] ? 'q' : 'later');
    p.append(s); fence.append(p); return s;
  });
  const sitter = h('div', 'sitter emo', rand(['🐔','🐦','🐱'])); sitter.style.left = `calc(${randInt(0, len - 1) * 20 + 10}% - 20px)`; fence.append(sitter);
  const spoken = () => seq.map((v, i) => miss.slice(cur).includes(i) ? 'hmm' : NUMW[v]).join(', ');
  sayInstr(`${cap(spoken())}. Hvilket tall mangler på gjerdet?`);
  const optsWrap = h('div');
  const ask = () => {
    optsWrap.innerHTML = '';
    const ans = seq[miss[cur]];
    optsWrap.append(optionButtons(numOptions(ans, Math.max(0, lv.lo - 1), lv.hi + 1), v => v, (v, b) => {
      if (v === ans) {
        const s = signs[miss[cur]]; s.className = 'sign filled'; s.textContent = v; boing(s); sfx.pop(); cur++;
        if (cur >= miss.length) { st.classList.add('locked'); later(() => win(`Ja! ${cap(seq.map(x => NUMW[x]).join(', '))}!`), 400); }
        else { signs[miss[cur]].className = 'sign q'; say(`Riktig! Og hvilket tall skal stå her? ${cap(spoken())}.`); ask(); }
      } else { sfx.hint(); shake(b); say(`Hør: ${spoken()}. ${dir === 'down' ? 'Vi teller nedover.' : 'Vi teller oppover.'}`); }
    }, 'opt txt num'));
  };
  ask();
  st.append(fence, optsWrap);
}

function rMath(st, n, g, lv){
  const op = lv.op === 'mix' ? rand(['+','-']) : lv.op;
  const A = rand(ANIM5);
  let a, b, r, story, hint;
  const eq = h('div', 'eq');
  if (op === '+') {
    a = randInt(1, lv.max - 1); b = randInt(1, lv.max - a); r = a + b;
    const ga = h('div', 'grp'), gb = h('div', 'grp arrive');
    for (let i = 0; i < a; i++) ga.append(h('span', 'a emo', A.e));
    for (let i = 0; i < b; i++) { const s = h('span', 'a emo', A.e); s.style.animationDelay = (.4 + i * .12) + 's'; gb.append(s); }
    eq.append(ga, h('span', 'op', '+'), gb);
    story = `${cap(qty(a, A))} er på enga. ${cap(qty(b, A))} kommer løpende. Hvor mange er det nå?`;
    hint = `Tell alle ${A.pl} sammen.`;
  } else {
    a = randInt(2, lv.max); b = randInt(1, a - 1); r = a - b;
    const ga = h('div', 'grp'); const els = [];
    for (let i = 0; i < a; i++) { const s = h('span', 'a emo', A.e); els.push(s); ga.append(s); }
    eq.append(ga, h('span', 'emo', '🏠'));
    later(() => els.slice(a - b).forEach(s => s.classList.add('leaving')), 900);
    story = `${cap(qty(a, A))} er på enga. ${cap(qty(b, A))} går inn i fjøset. Hvor mange er igjen?`;
    hint = `Tell bare de som er igjen på enga.`;
  }
  const qq = h('span', 'qq', '?');
  const line = h('div', 'eqline', `<span>${a}</span><span>${op === '+' ? '+' : '−'}</span><span>${b}</span><span>=</span>`); line.append(qq);
  sayInstr(story);
  const ob = optionButtons(numOptions(r, 0, lv.max), v => v, (v, btn) => {
    if (v === r) { qq.textContent = r; boing(qq); win(`Riktig! ${cap(NUMW[a])} ${op === '+' ? 'pluss' : 'minus'} ${NUMW[b]} er ${NUMW[r]}.`); }
    else { sfx.hint(); shake(btn); say(hint); }
  }, 'opt txt num');
  st.append(eq, line, ob);
}

let age = null, current = null, levelIdx = 0, roundNo = 0, rounds = 3, token = 0, playStart = null;

const AGE_COLOR = {2:'var(--age2)', 3:'var(--age3)', 5:'var(--age5)'};

function later(fn, ms){ const t = token; return setTimeout(() => { if (t === token) fn(); }, ms); }
function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  $('#guide').hidden = id === 'home';
}
function setGuide(id){ $('#gchar').innerHTML = charSVG(id); }

function goHome(){ token++; hush(); stage.innerHTML = ''; $('#app').classList.remove('farm'); show('home'); }
function openMenu(a){
  token++; hush(); age = a; stage.innerHTML = '';
  if (!playStart) playStart = Date.now();
  $('#app').classList.toggle('farm', a === 5);
  document.documentElement.style.setProperty('--agec', AGE_COLOR[a]);
  const grid = $('#menuGrid'); grid.innerHTML = '';
  $('#menuTitle').textContent = a === 5 ? 'På gården' : `Spill for ${a}-åringer`;
  GAMES[a].forEach(g => {
    const doneN = g.levels.filter((_, i) => isDone(g.id, i)).length;
    const t = h('button', 'gtile', `<span class="emo">${g.icon}</span><span class="t">${g.name}</span><span class="prog"><span class="emo">⭐</span> ${doneN} av ${g.levels.length}</span>`);

    grid.append(t);
  });

  show('menu');
  say(a === 5 ? 'Velkommen til gården! Her kan du øve på bokstaver og tall.' : 'Hva vil du leke med?');
}
function openLevels(g){
  token++; hush(); stage.innerHTML = ''; current = g;
  $('#lvTitle').textContent = g.name;
  const grid = $('#lvGrid'); grid.innerHTML = '';
  const firstOpen = g.levels.findIndex((_, i) => !isDone(g.id, i));
  g.levels.forEach((lv, i) => {
    const d = isDone(g.id, i);
    const b = h('button', 'lvbtn' + (d ? ' done' : '') + (i === firstOpen ? ' next' : ''),
      `<span class="lvnum">${i + 1}</span>${lv.icon ? `<span class="lvicon emo">${lv.icon}</span>` : ''}${d ? '<span class="lvstar emo">⭐</span>' : ''}`);

    b.onclick = () => { actx(); startLevel(i); };

  });
  setGuide(g.guide); show('levels');

}
function renderPips(filled = 0){
  $('#pips').innerHTML = [...Array(rounds)].map((_, i) => `<i class="pip${i < filled ? ' on' : ''}"></i>`).join('');
}
function startLevel(i){
  token++; hush(); levelIdx = i; roundNo = 0;
  const lv = current.levels[i];
  rounds = lv.rounds || 3; current.st = {}; current.onResize = null;
  $('#gameTitle').innerHTML = `${current.name}<small>Brett ${i + 1}</small>`;
  setGuide(current.guide); show('game'); renderPips(0); runRound();
}
function runRound(){
  token++; stage.innerHTML = ''; stage.classList.remove('locked'); stage.scrollTop = 0;
  current.onResize = null;
  current.round(stage, roundNo, current, current.levels[levelIdx]);
}
function win(msg){
  stage.classList.add('locked');
  sfx.win(); burst(); cheer(); say(msg || rand(PRAISE));
  renderPips(roundNo + 1);
  if (roundNo + 1 >= rounds) later(levelDone, 2400);
  else later(() => { roundNo++; runRound(); }, 2400);
}
function levelDone(){
  markDone(current.id, levelIdx);
  const last = levelIdx >= current.levels.length - 1;
  $('#doneTitle').textContent = `Brett ${levelIdx + 1} er ferdig!`;
  $('#doneNext').style.display = last ? 'none' : '';
  $('#jumpers').innerHTML = ['nuppe','toffe','pling','molle'].map(charSVG).join('');
  $('#doneOv').classList.add('show'); sfx.win(); burst();
  say(last ? 'Hurra! Du har klart alle brettene!' : `Hurra! Du klarte brett ${levelIdx + 1}! Vil du prøve neste brett?`);
}

  if (key === 'pause') playStart = Date.now();
  saveSettings(); refreshPanel();
}));
$('#resetProg').onclick = () => { progress = {}; saveProgress(); $('#resetProg').textContent = 'Nullstilt'; };
holdButton($('#parentBtn'), 1500, () => { refreshPanel(); $('#resetProg').textContent = 'Nullstill'; $('#parentOv').classList.add('show'); });
$('#parentClose').onclick = () => $('#parentOv').classList.remove('show');

/* ---------- Pausepåminnelse ---------- */
setInterval(() => {
  if (!playStart || !settings.pause || $('#pauseOv').classList.contains('show')) return;
  if (Date.now() - playStart > settings.pause * 60000) {
    token++; hush(); $('#doneOv').classList.remove('show'); $('#pauseOv').classList.add('show');
    say('Nå har vi lekt lenge. Det er tid for en pause!');
  }
}, 10000);
holdButton($('#pauseContinue'), 2000, () => { $('#pauseOv').classList.remove('show'); playStart = Date.now(); if (age) openMenu(age); else goHome(); });
['gesturestart','gesturechange','gestureend'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
let lastTouchEnd = 0;
document.addEventListener('touchend', e => { const now = Date.now(); if (now - lastTouchEnd < 350) e.preventDefault(); lastTouchEnd = now; }, {passive:false});
if ('serviceWorker' in navigator && location.protocol === 'https:') addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
